<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hpbar</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="hero-card">Tony El DumDum 🧙‍♂️
        <p>Health: <span id="hp-text">100 / 100</span></p>
        <div class="meter-track">
            <div id="hp-fill"></div>
        </div>
        <p>Mana: <span id="mp-text">100 / 100</span></p>
        <div class="meter-track">
            <div id="mp-fill"></div>
        </div>
        <div id="controls">
            <button id="btn-damage">Take Damage</button>
            <button id="btn-potion">Drink Potion</button>
            <button id="btn-spell">Cast Spell</button>
            <button id="btn-reset">Rest/Reset</button>
        </div>
        <div id="notifs"></div>

        <script src="index.js"></script>
    </div>
</body>

</html>
